name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cuentaclara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only credentials for the service container above
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/cuentaclara_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (format)
        run: ruff format --check .

      - name: Ruff (lint)
        run: ruff check .

      - name: Tests
        run: pytest

      - name: Dependency audit
        run: pip-audit --skip-editable

  frontend:
    name: Frontend (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit (production, blocking)
        run: npm audit --omit=dev --audit-level=high

      # Known advisories in lint-only tooling (docs/decisions.md D-034): reported, not blocking
      - name: Dependency audit (all, informational)
        continue-on-error: true
        run: npm audit --audit-level=high

  infra:
    name: Infra (docker compose + E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create .env from example
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build and start the stack, wait until healthy
        run: docker compose up --detach --build --wait

      - name: Smoke test the API (health, register, login)
        run: |
          api=http://localhost:8000/api/v1
          body='{"email":"smoke@example.com","password":"Lluvia-Verde-2026!","name":"Smoke","accept_terms":true}'
          curl --fail --silent --show-error "$api/health"
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d "$body" "$api/auth/register"
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"Lluvia-Verde-2026!"}' "$api/auth/login"

      - name: Smoke test the frontend (pages, CSP, /api proxy)
        run: |
          web=http://localhost:3000
          curl --fail --silent --show-error -o /dev/null "$web/"
          curl --fail --silent --show-error -o /dev/null "$web/login"
          curl --fail --silent --show-error -D - -o /dev/null "$web/" | grep -i "content-security-policy: .*nonce-"
          curl --fail --silent --show-error "$web/api/v1/health"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright + axe accessibility audit)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes
