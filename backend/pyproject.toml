[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cuenta-clara-api"
version = "0.1.0"
description = "REST API for Cuenta Clara, a personal finance app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "fastapi==0.142.2",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pyjwt==2.15.1",
  "slowapi==0.1.10",
  "sqlalchemy==2.1.3",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, bandit (security), simplify, naming
select = ["E", "F", "I", "B", "UP", "S", "SIM", "N"]

[tool.ruff.lint.isort]
# The local `alembic/` folder would otherwise make isort treat the library as first-party
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake credentials are expected in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
